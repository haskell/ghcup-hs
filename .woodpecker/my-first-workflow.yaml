when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: win10
   commands:
     - cd
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk:
         uuid: BHYVE-EACC-BD89-8B7D
         disk_image: /var/lib/libvirt/images/win10-shared.img
       ssh_config:
         username: maerwald
         password: anevasti
         timeout: 2m
         hostname: win10
