when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: vm1
   commands:
     - cat ${TMPDIR:-/tmp}/woodpecker_*.pid
     - echo $CI_SCRIPT
     - apk update
     - apk add --no-cache git
     - git clone "${CI_REPO_CLONE_URL}" --branch "${CI_COMMIT_BRANCH}" .
     - git reset --hard "${CI_COMMIT_SHA}"
     - apk add --no-cache alpine-sdk autoconf automake bash build-base bsd-compat-headers coreutils cpio curl gcc gmp gmp-dev grep libffi-dev linux-headers gzip jq libffi-dev lld musl-dev musl-locales ncurses-dev ncurses-libs perl python3 unzip wget xz-dev bzip2-dev zlib-dev openssl-dev zstd
     - curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=yes sh
     - source ~/.ghcup/env
     - cabal build
   environment:
     LIBVIRT_SSH_PW:
       from_secret: vm1_ssh_pw
   backend_options:
     libvirt:
       ephemeral: true
       ssh_config:
         username: root
         timeout: 2m
         hostname: vm1
