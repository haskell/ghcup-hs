when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
  - name: build
    image: vm1
    commands:
      - mount
      - ls -lah /woodpecker
      - pwd
      - ls -lah
      - echo "This is the build step"
    backend_options:
      libvirt:
        shared_disk:
          uuid: bd5ea041-e765-4d3a-9cda-083e4e52b187
          image: /var/lib/libvirt/images/shared.qcow2
        ssh_config:
          username: root
          password: root
