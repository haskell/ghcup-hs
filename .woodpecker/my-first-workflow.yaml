when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
  - name: build
    image: vm1
    commands:
      - pwd
      - ls -lah
      - echo "This is the build step"
    backend_options:
      libvirt:
        shared_disk:
          uuid: bd5ea041-e765-4d3a-9cda-083e4e52b187
          xml: |
            <disk type='file' device='disk'>
              <driver name='qemu' type='qcow2'/>
              <source file='/var/lib/libvirt/images/shared.qcow2'/>
              <target dev='vdb' bus='virtio'/>
            </disk>
        ssh_config:
          username: root
          password: root
