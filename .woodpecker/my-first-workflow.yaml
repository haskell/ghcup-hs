when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: vm1
   commands:
     - git clone "$CI_REPO_CLONE_URL" --branch "$CI_COMMIT_BRANCH"
     - get reset --hard "$CI_COMMIT_SHA"
     - apk add --no-cache alpine-sdk autoconf automake bash binutils-gold build-base coreutils cpio curl gcc git gmp gmp-dev grep libffi linux-headers gzip jq libffi-dev lld musl-dev musl-locales ncurses-dev ncurses-libs ncurses-static perl python3 sudo unzip wget xz zlib-dev zstd py3-sphinx texlive texlive-xetex texmf-dist-latexextra ttf-dejavu
     - apk add --no-cache gmp-static llvm clang texmf-dist-lang texmf-dist-fontsrecommended texinfo
     - curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=yes sh
     - source ~/.ghcup/env
     - cabal build
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: &shared_disk
         uuid: "f1b0bcff-6b05-4c2a-872c-7ce394691f7a"
         disk_config: |
           <disk type='file' device='disk'>
             <driver name='qemu' type='raw'/>
             <source file='/var/lib/libvirt/images/linux-shared.img'/>
             <target dev='sdb' bus='sata'/>
             <serial>BHYVE-ABCDEF-CAFE</serial>
             <address type='drive' controller='0' bus='0' target='0' unit='1'/>
           </disk>
       ssh_config:
         username: root
         password: root
         timeout: 2m
         hostname: vm1
