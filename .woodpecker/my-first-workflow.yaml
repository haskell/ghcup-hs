when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: win10
   commands:
     - Write-Host "Hello, World!"
     - Set-Content -Path ".\hello.txt" -Value "hello"
     - Get-ChildItem
     - Write-Host "Hello, World2!"
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk:
         uuid: "589C_FC20_C5D2_0001."
         disk_config: |
           <disk type='file'>
             <driver name='file' type='raw'/>
             <source file='/var/lib/libvirt/images/win10-shared.img'/>
             <target dev='nvme0n1' bus='nvme'/>
           </disk>
       ssh_config:
         username: maerwald
         password: anevasti
         timeout: 2m
         hostname: win10
