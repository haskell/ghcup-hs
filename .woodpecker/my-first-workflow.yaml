when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: win11
   commands:
     - Set-ExecutionPolicy Bypass -Scope Process -Force;[System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; try { & ([ScriptBlock]::Create((Invoke-WebRequest https://raw.githubusercontent.com/haskell/ghcup-hs/8e76f07f52e764e9be788ae7d3457e0e06cde01f/scripts/bootstrap/bootstrap-haskell.ps1 -UseBasicParsing))) -DisableCurl -Msys2Env CLANG64 -Minimal } catch { Write-Error $_ }
     - C:/ghcup/msys64/usr/bin/bash.exe --login -e -c "pacman --noconfirm -S --needed --overwrite '*' bash winpty git tar bsdtar unzip binutils autoconf make xz curl libtool automake p7zip patch ca-certificates python3 zip mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-tools-git gzip mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-zlib && git clone ${CI_REPO_CLONE_URL} --branch ${CI_COMMIT_BRANCH} . && rm -f /c/Strawberry/perl/bin/pkg-config /clang64/bin/zlib1.dll && ghcup install ghc --set ${GHC} && ghcup install cabal --set ${CABAL}"
     - C:/ghcup/msys64/usr/bin/bash.exe --login -e .github/scripts/build.sh --ghc ghc-${GHC} --verbose --os Windows --check-linking --strip
   environment:
     GHC: 9.10.3
     CABAL: 3.18.1.0
     CABAL_DIR: "C:/Users/runneradmin/AppData/Roaming/cabal"
     GHCUP_MSYS2_ENV: CLANG64
     GHCUP_INSTALL_BASE_PREFIX: "C:/"
     LIBVIRT_SSH_PW:
       from_secret: win11_ssh_pw
   backend_options:
     libvirt:
       ephemeral: true
       ssh_config:
         username: maerwald
         timeout: 2m
         hostname: win11
