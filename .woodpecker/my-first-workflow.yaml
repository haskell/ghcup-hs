when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: win11
   commands:
     - conhost.exe C:/ghcup/msys64/usr/bin/bash.exe --login -c 'exit'
     - C:/ghcup/msys64/usr/bin/bash.exe --login -e -c "git clone ${CI_REPO_CLONE_URL} --branch ${CI_COMMIT_BRANCH} ."
     - C:/ghcup/msys64/usr/bin/bash.exe --login -e .github/scripts/build.sh --ghc ghc-${GHC} --verbose --os Windows --check-linking --strip
   environment:
     GHC: 9.10.3
     CABAL: 3.18.1.0
     CABAL_DIR: "C:/Users/runneradmin/AppData/Roaming/cabal"
     GHCUP_MSYS2_ENV: CLANG64
     GHCUP_INSTALL_BASE_PREFIX: "C:/"
     LIBVIRT_SSH_PW:
       from_secret: win11_ssh_pw
   backend_options:
     libvirt:
       ephemeral: true
       ssh_config:
         username: maerwald
         timeout: 2m
         hostname: win11
