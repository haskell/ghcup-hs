when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: vm1
   commands:
     - apk update
     - apk add --no-cache git
     - git clone "${CI_REPO_CLONE_URL}" --branch "${CI_COMMIT_BRANCH}" .
     - git reset --hard "${CI_COMMIT_SHA}"
     - apk add --no-cache alpine-sdk autoconf automake bash build-base coreutils cpio curl gcc gmp gmp-dev grep libffi linux-headers gzip jq libffi-dev lld musl-dev musl-locales ncurses-dev ncurses-libs perl python3 unzip wget xz zlib-dev zstd
     - curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=yes sh
     - source ~/.ghcup/env
     - cabal build
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: &shared_disk
         uuid: "aec8e2aa-fe07-49eb-b293-2cde1ff60992"
         disk_config: |
           <disk type='file' device='disk'>
             <driver name='qemu' type='qcow2'/>
             <source file='/var/lib/libvirt/images/linux-shared.qcow2'/>
             <target dev='sdb' bus='sata'/>
             <serial>BHYVE-ABCDEF-CAFE</serial>
             <address type='drive' controller='0' bus='0' target='0' unit='1'/>
           </disk>
       ssh_config:
         username: root
         password: root
         timeout: 2m
         hostname: vm1
