when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: win10
   commands:
     - Write-Host "Hello, World!"
     - Write-Host "Hello, World2"
     - Set-Content -Path ".\hello.txt" -Value "hello"
     - Get-ChildItem
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: &shared_disk
         uuid: "BHYVE-ABCDEF-CAFE"
         disk_config: |
           <disk type='file'>
             <serial>BHYVE-ABCDEF-CAFE</serial>
             <driver name='file' type='raw'/>
             <source file='/var/lib/libvirt/images/win10-shared.img'/>
             <target dev='sdb' bus='sata'/>
           </disk>
       ssh_config:
         username: maerwald
         password: anevasti
         timeout: 2m
         hostname: win10
 - name: build
   image: win10-clone
   commands:
     - Write-Host "Hello, World2!"
     - Get-Content -Path ".\hello.text"
     - Get-ChildItem
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: *shared_disk
       ssh_config:
         username: maerwald
         password: anevasti
         timeout: 2m
         hostname: win10-clone
