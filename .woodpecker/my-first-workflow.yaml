when:
  - platform: freebsd/amd64
  - event: push
  - event: manual

skip_clone: true

steps:
 - name: build
   image: vm1
   commands:
     - ls -lah
     - pwd
     - echo "foo" > hello.txt
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: &shared_disk
         uuid: "f1b0bcff-6b05-4c2a-872c-7ce394691f7a"
         disk_config: |
           <disk type='file' device='disk'>
             <driver name='qemu' type='raw'/>
             <source file='/var/lib/libvirt/images/linux-shared.img'/>
             <target dev='sdb' bus='sata'/>
             <serial>BHYVE-ABCDEF-CAFE</serial>
             <address type='drive' controller='0' bus='0' target='0' unit='1'/>
           </disk>
       ssh_config:
         username: root
         password: root
         timeout: 2m
         hostname: vm1
 - name: build
   image: fedora
   commands:
     - ls -lah
     - pwd
     - cat hello.txt
   backend_options:
     libvirt:
       ephemeral: true
       shared_disk: *shared_disk
       ssh_config:
         username: julian
         password: yup
         timeout: 2m
         hostname: fedora
